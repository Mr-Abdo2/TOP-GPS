<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Track Pro — إدارة السيارات</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .vehicles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .vg-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      transition: all 0.3s ease;
    }
    .vg-card:hover { border-color: rgba(59,130,246,0.3); transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .vg-card-top {
      padding: 16px;
      background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(124,58,237,0.04));
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .vg-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .vg-card-body { padding: 14px 16px; }
    .vg-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .vg-row:last-child { border-bottom: none; }
    .vg-row-label { color: var(--text-secondary); }
    .vg-row-value { font-weight: 600; }
    .vg-card-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar">
      <div>
        <div class="topbar-title">🚗 إدارة السيارات</div>
        <div class="topbar-subtitle">إضافة وتعديل وحذف سيارات الأسطول</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openAddModal()">➕ إضافة سيارة</button>
      </div>
    </header>
    <div class="page-content" id="page-content">
      <!-- Stats Row -->
      <div class="kpi-grid" style="margin-bottom:20px" id="kpi-row"></div>

      <!-- Filters -->
      <div class="card mb-16" style="margin-bottom:16px">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <input type="text" id="filter-search" class="form-control" placeholder="🔍 ابحث..." style="max-width:250px" oninput="applyFilters()">
          <select id="filter-status" class="form-control" style="max-width:160px" onchange="applyFilters()">
            <option value="">جميع الحالات</option>
            <option value="moving">يتحرك</option>
            <option value="stopped">واقف</option>
            <option value="idle">خامل</option>
            <option value="offline">غير متصل</option>
          </select>
          <select id="filter-type" class="form-control" style="max-width:160px" onchange="applyFilters()">
            <option value="">جميع الأنواع</option>
            <option value="سيدان">سيدان</option>
            <option value="SUV">SUV</option>
            <option value="بيك أب">بيك أب</option>
            <option value="ميني باص">ميني باص</option>
          </select>
          <button class="btn btn-secondary" onclick="applyFilters(true)">🔄 إعادة ضبط</button>
          <span style="margin-right:auto;font-size:12px;color:var(--text-secondary)" id="filter-count"></span>
        </div>
      </div>

      <!-- Vehicles Grid -->
      <div class="vehicles-grid" id="vehicles-grid"></div>
    </div>
  </main>
</div>
<div id="toast-container"></div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="vehicle-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">إضافة سيارة جديدة</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">اسم السيارة *</label>
          <input type="text" class="form-control" id="f-name" placeholder="مثال: السيارة الحادية عشر">
        </div>
        <div class="form-group">
          <label class="form-label">رقم اللوحة *</label>
          <input type="text" class="form-control" id="f-plate" placeholder="أ ب ج 1234" dir="ltr">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">الماركة</label>
          <select class="form-control" id="f-make">
            <option>تويوتا</option><option>كيا</option><option>هيونداي</option><option>نيسان</option><option>فورد</option><option>مرسيدس</option><option>BMW</option><option>أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">الموديل</label>
          <input type="text" class="form-control" id="f-model" placeholder="كورولا / سبورتاج ...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">سنة الصنع</label>
          <input type="number" class="form-control" id="f-year" min="2000" max="2026" value="2022">
        </div>
        <div class="form-group">
          <label class="form-label">نوع المركبة</label>
          <select class="form-control" id="f-type">
            <option>سيدان</option><option>SUV</option><option>بيك أب</option><option>ميني باص</option><option>شاحنة صغيرة</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">سعة خزان الوقود (لتر)</label>
          <input type="number" class="form-control" id="f-tank" min="30" max="150" value="60">
        </div>
        <div class="form-group">
          <label class="form-label">لون التمييز</label>
          <input type="color" class="form-control" id="f-color" value="#3b82f6" style="height:42px;padding:4px 8px;cursor:pointer">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">السائق</label>
        <select class="form-control" id="f-driver">
          <option value="">-- لا يوجد سائق --</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveVehicle()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-title">⚠️ تأكيد الحذف</div>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-secondary);font-size:14px">هل أنت متأكد من حذف <strong id="delete-name" style="color:var(--text-primary)"></strong>؟ لا يمكن التراجع عن هذا الإجراء.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">إلغاء</button>
      <button class="btn btn-danger" onclick="confirmDelete()">🗑️ حذف</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/data.js"></script>
<script src="../js/tracking.js"></script>
<script src="../js/map.js"></script>
<script src="../js/alerts.js"></script>
<script>
// ===== Sidebar & Topbar (shared helper) =====
FleetData.init();
TrackingEngine.start();
AlertsManager.init();

function renderSharedSidebar() {
  const stats = FleetData.getFleetStats();
  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-logo">
      <div class="logo-icon">🚗</div>
      <div class="logo-text"><h1>Fleet Track Pro</h1><span>نظام تتبع الأسطول</span></div>
    </div>
    <div class="fleet-status-mini">
      <div class="status-badge moving"><span class="count">${stats.moving}</span>يتحرك</div>
      <div class="status-badge stopped"><span class="count">${stats.stopped}</span>واقف</div>
      <div class="status-badge idle"><span class="count">${stats.idle + stats.offline}</span>خامل</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">التتبع الحي</div>
      <a class="nav-item" href="../index.html"><span class="nav-icon">🗺️</span> لوحة التحكم</a>
      <div class="nav-section-title">الإدارة</div>
      <a class="nav-item active" href="vehicles.html"><span class="nav-icon">🚗</span> إدارة السيارات</a>
      <a class="nav-item" href="drivers.html"><span class="nav-icon">👤</span> السائقون</a>
      <div class="nav-section-title">التحليل</div>
      <a class="nav-item" href="history.html"><span class="nav-icon">📍</span> تاريخ الرحلات</a>
      <a class="nav-item" href="reports.html"><span class="nav-icon">📊</span> التقارير</a>
      <a class="nav-item" href="alerts.html"><span class="nav-icon">🔔</span> التنبيهات
        <span class="nav-badge" id="alert-nav-badge">${stats.alerts}</span>
      </a>
      <div class="nav-section-title">الإعدادات</div>
      <a class="nav-item" href="geofence.html"><span class="nav-icon">🏁</span> مناطق الجيوفنس</a>
      <a class="nav-item" href="account.html"><span class="nav-icon">👤</span> حسابي</a>
    </nav>
    <div class="sidebar-footer"><div class="user-card">
      <div class="user-avatar">م</div>
      <div class="user-info"><h4>مدير الأسطول</h4><span>متصل الآن</span></div>
    </div></div>`;
}

// ===== Render Page =====
function renderKPIs() {
  const stats = FleetData.getFleetStats();
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card blue"><div class="kpi-icon">🚗</div><div class="kpi-value">${stats.total}</div><div class="kpi-label">إجمالي السيارات</div></div>
    <div class="kpi-card green"><div class="kpi-icon">✅</div><div class="kpi-value text-green">${stats.moving}</div><div class="kpi-label">تتحرك</div></div>
    <div class="kpi-card red"><div class="kpi-icon">🛑</div><div class="kpi-value text-red">${stats.stopped}</div><div class="kpi-label">متوقفة</div></div>
    <div class="kpi-card yellow"><div class="kpi-icon">💤</div><div class="kpi-value text-yellow">${stats.idle}</div><div class="kpi-label">خاملة</div></div>`;
}

function renderVehicles(vehicles) {
  const grid = document.getElementById('vehicles-grid');
  const statusColors = { moving: 'var(--green)', stopped: 'var(--red)', idle: 'var(--yellow)', offline: 'var(--text-muted)' };
  const statusLabels = { moving: 'يتحرك', stopped: 'واقف', idle: 'خامل', offline: 'غير متصل' };
  const typeEmojis = { 'سيدان': '🚗', 'SUV': '🚙', 'بيك أب': '🛻', 'ميني باص': '🚐', 'شاحنة صغيرة': '🚚' };

  if (vehicles.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🚗</div><h3>لا توجد سيارات</h3><p>أضف سيارات لبدء التتبع</p></div>`;
    return;
  }

  grid.innerHTML = vehicles.map(v => {
    const driver = FleetData.getDriverByVehicle(v.id);
    const sc = statusColors[v.status] || '#6b7280';
    const sl = statusLabels[v.status] || v.status;
    const emoji = typeEmojis[v.type] || '🚗';
    const fuelPct = v.fuel || 0;
    const fuelColor = fuelPct > 50 ? 'var(--green)' : fuelPct > 20 ? 'var(--yellow)' : 'var(--red)';
    return `
      <div class="vg-card">
        <div class="vg-card-top">
          <div class="vg-icon" style="background:${v.color}22;border:1px solid ${v.color}44">${emoji}</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:15px">${v.name}</div>
            <div style="font-size:12px;color:var(--text-secondary)">${v.make} ${v.model} ${v.year}</div>
            <div style="font-size:11px;color:var(--text-muted);font-family:monospace;direction:ltr;text-align:right">${v.plate}</div>
          </div>
          <span style="font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px;background:${sc}22;color:${sc};border:1px solid ${sc}44">${sl}</span>
        </div>
        <div class="vg-card-body">
          <div class="vg-row"><span class="vg-row-label">السرعة</span><span class="vg-row-value" style="color:${v.speed > 80 ? 'var(--red)' : 'var(--text-primary)'}">${v.speed || 0} كم/س</span></div>
          <div class="vg-row"><span class="vg-row-label">السائق</span><span class="vg-row-value">${driver ? driver.name : 'غير محدد'}</span></div>
          <div class="vg-row"><span class="vg-row-label">العداد</span><span class="vg-row-value">${(v.odometer || 0).toLocaleString('ar-EG')} كم</span></div>
          <div class="vg-row">
            <span class="vg-row-label">الوقود</span>
            <div style="display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end">
              <div style="width:80px;height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${fuelPct}%;background:${fuelColor};border-radius:3px;transition:width 0.5s"></div>
              </div>
              <span class="vg-row-value" style="color:${fuelColor}">${Math.round(fuelPct)}%</span>
            </div>
          </div>
          <div class="vg-row"><span class="vg-row-label">سعة الخزان</span><span class="vg-row-value">${v.tankCapacity} لتر</span></div>
        </div>
        <div class="vg-card-footer">
          <a href="../index.html" class="btn btn-secondary btn-sm" style="flex:1;justify-content:center;text-decoration:none" onclick="localStorage.setItem('focusVehicle','${v.id}')">🗺️ تتبع</a>
          <button class="btn btn-secondary btn-sm" style="flex:1;justify-content:center" onclick="openEditModal('${v.id}')">✏️ تعديل</button>
          <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${v.id}','${v.name}')">🗑️</button>
        </div>
      </div>`;
  }).join('');
  document.getElementById('filter-count').textContent = `${vehicles.length} سيارة`;
}

function applyFilters(reset = false) {
  if (reset) {
    document.getElementById('filter-search').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('filter-type').value = '';
  }
  const q = document.getElementById('filter-search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const tp = document.getElementById('filter-type').value;
  let vehicles = FleetData.getVehicles();
  if (q) vehicles = vehicles.filter(v => v.name.includes(q) || v.plate.includes(q) || v.make.includes(q));
  if (st) vehicles = vehicles.filter(v => v.status === st);
  if (tp) vehicles = vehicles.filter(v => v.type === tp);
  renderVehicles(vehicles);
}

// ===== Modal Logic =====
function openAddModal() {
  document.getElementById('modal-title').textContent = 'إضافة سيارة جديدة';
  document.getElementById('edit-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-plate').value = '';
  document.getElementById('f-model').value = '';
  document.getElementById('f-year').value = '2022';
  document.getElementById('f-tank').value = '60';
  document.getElementById('f-color').value = '#3b82f6';
  populateDriverSelect('');
  document.getElementById('vehicle-modal').classList.add('open');
}

function openEditModal(id) {
  const v = FleetData.getVehicleById(id);
  if (!v) return;
  document.getElementById('modal-title').textContent = 'تعديل بيانات السيارة';
  document.getElementById('edit-id').value = id;
  document.getElementById('f-name').value = v.name;
  document.getElementById('f-plate').value = v.plate;
  document.getElementById('f-make').value = v.make;
  document.getElementById('f-model').value = v.model;
  document.getElementById('f-year').value = v.year;
  document.getElementById('f-type').value = v.type;
  document.getElementById('f-tank').value = v.tankCapacity;
  document.getElementById('f-color').value = v.color;
  populateDriverSelect(v.driverId);
  document.getElementById('vehicle-modal').classList.add('open');
}

function populateDriverSelect(selectedId) {
  const drivers = FleetData.getDrivers();
  const sel = document.getElementById('f-driver');
  sel.innerHTML = '<option value="">-- لا يوجد سائق --</option>' +
    drivers.map(d => `<option value="${d.id}" ${d.id === selectedId ? 'selected' : ''}>${d.name}</option>`).join('');
}

function closeModal() { document.getElementById('vehicle-modal').classList.remove('open'); }

function saveVehicle() {
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('f-name').value.trim();
  const plate = document.getElementById('f-plate').value.trim();
  if (!name || !plate) { AlertsManager.showToast('يرجى ملء جميع الحقول المطلوبة', 'error', '❌'); return; }
  const data = {
    name, plate,
    make: document.getElementById('f-make').value,
    model: document.getElementById('f-model').value,
    year: parseInt(document.getElementById('f-year').value),
    type: document.getElementById('f-type').value,
    tankCapacity: parseInt(document.getElementById('f-tank').value),
    color: document.getElementById('f-color').value,
    driverId: document.getElementById('f-driver').value,
    status: 'offline', speed: 0, fuel: 100,
    lat: 30.044 + (Math.random() - 0.5) * 0.05,
    lng: 31.235 + (Math.random() - 0.5) * 0.05,
    odometer: 0
  };
  if (id) {
    FleetData.updateVehicle(id, data);
    AlertsManager.showToast('تم تحديث بيانات السيارة بنجاح', 'success', '✅');
  } else {
    FleetData.addVehicle(data);
    AlertsManager.showToast('تمت إضافة السيارة بنجاح', 'success', '✅');
  }
  closeModal();
  applyFilters();
  renderKPIs();
}

let deleteTargetId = null;
function openDeleteModal(id, name) {
  deleteTargetId = id;
  document.getElementById('delete-name').textContent = name;
  document.getElementById('delete-modal').classList.add('open');
}
function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); deleteTargetId = null; }
function confirmDelete() {
  if (!deleteTargetId) return;
  FleetData.deleteVehicle(deleteTargetId);
  closeDeleteModal();
  applyFilters();
  renderKPIs();
  AlertsManager.showToast('تم حذف السيارة', 'success', '🗑️');
}

// ===== Init =====
renderSharedSidebar();
renderKPIs();
applyFilters();

// Live refresh
TrackingEngine.on('tick', () => { applyFilters(); renderKPIs(); AlertsManager.updateAlertBadge(); });
</script>
</body>
</html>
