<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fleet Track Pro — تاريخ الرحلات</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .history-layout { display: grid; grid-template-columns: 360px 1fr; gap: 0; height: calc(100vh - var(--topbar-h)); }
    .history-panel { background: var(--bg-secondary); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .history-map { position: relative; }
    #history-map { width: 100%; height: 100%; }
    .trip-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
    }
    .trip-card:hover { border-color: rgba(59,130,246,0.3); }
    .trip-card.active { border-color: var(--accent); background: rgba(59,130,246,0.07); }
    .trip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .trip-time { font-size: 12px; font-weight: 700; }
    .trip-stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .trip-stat { background: var(--bg-secondary); border-radius: 6px; padding: 3px 8px; font-size: 11px; }
    .stop-badge { background: var(--yellow-glow); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); border-radius: 5px; padding: 2px 6px; font-size: 10px; font-weight: 700; }
    .leaflet-tile-pane { filter: brightness(0.65) saturate(0.6) hue-rotate(195deg); }
    .leaflet-control-zoom a { background: var(--bg-card) !important; color: var(--text-primary) !important; border-color: var(--border) !important; }
    .leaflet-popup-content-wrapper { background: white; border-radius: 10px; }
    .leaflet-popup-tip-container { display: none; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar">
      <div>
        <div class="topbar-title">📍 تاريخ الرحلات</div>
        <div class="topbar-subtitle">عرض مسارات السيارات والتوقفات</div>
      </div>
      <div class="topbar-right">
        <select class="form-control" id="vehicle-select" onchange="onVehicleChange()" style="min-width:200px">
          <option value="">-- اختر سيارة --</option>
        </select>
        <input type="date" class="form-control" id="date-select" onchange="onDateChange()" style="direction:ltr">
      </div>
    </header>

    <div class="history-layout">
      <!-- Left Panel: Trip List -->
      <div class="history-panel">
        <div class="split-panel-header" style="padding:16px;border-bottom:1px solid var(--border)">
          <div style="font-size:14px;font-weight:700;margin-bottom:4px">الرحلات</div>
          <div id="trip-summary" style="font-size:12px;color:var(--text-secondary)">اختر سيارة وتاريخاً</div>
        </div>
        <div class="split-panel-body" style="flex:1;overflow-y:auto;padding:12px" id="trips-list">
          <div class="empty-state"><div class="empty-icon">📅</div><p>اختر سيارة وتاريخاً لعرض رحلاتها</p></div>
        </div>
        <!-- Day Summary -->
        <div id="day-stats" style="display:none;padding:12px;border-top:1px solid var(--border);background:var(--bg-card)">
          <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase">ملخص اليوم</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="day-stats-grid"></div>
        </div>
      </div>

      <!-- Right: Map -->
      <div class="history-map">
        <div id="history-map"></div>
        <div style="position:absolute;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:6px">
          <button class="map-btn" onclick="showAllTrips()">🗺️ عرض كل الرحلات</button>
        </div>
        <!-- Map Info Box -->
        <div id="map-info" style="position:absolute;top:12px;left:12px;z-index:1000;background:rgba(13,19,35,0.92);border:1px solid var(--border);border-radius:10px;padding:12px 16px;backdrop-filter:blur(10px);display:none;min-width:200px">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px" id="map-info-title">معلومات الرحلة</div>
          <div id="map-info-body"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/data.js"></script>
<script src="../js/tracking.js"></script>
<script src="../js/map.js"></script>
<script src="../js/alerts.js"></script>
<script>
FleetData.init();
TrackingEngine.start();
AlertsManager.init();

let histMap = null;
let currentTrips = [];
let layers = [];

function renderSharedSidebar() {
  const stats = FleetData.getFleetStats();
  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-logo"><div class="logo-icon">🚗</div><div class="logo-text"><h1>Fleet Track Pro</h1><span>نظام تتبع الأسطول</span></div></div>
    <div class="fleet-status-mini">
      <div class="status-badge moving"><span class="count">${stats.moving}</span>يتحرك</div>
      <div class="status-badge stopped"><span class="count">${stats.stopped}</span>واقف</div>
      <div class="status-badge idle"><span class="count">${stats.idle + stats.offline}</span>خامل</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">التتبع الحي</div>
      <a class="nav-item" href="../index.html"><span class="nav-icon">🗺️</span> لوحة التحكم</a>
      <div class="nav-section-title">الإدارة</div>
      <a class="nav-item" href="vehicles.html"><span class="nav-icon">🚗</span> إدارة السيارات</a>
      <a class="nav-item" href="drivers.html"><span class="nav-icon">👤</span> السائقون</a>
      <div class="nav-section-title">التحليل</div>
      <a class="nav-item active" href="history.html"><span class="nav-icon">📍</span> تاريخ الرحلات</a>
      <a class="nav-item" href="reports.html"><span class="nav-icon">📊</span> التقارير</a>
      <a class="nav-item" href="alerts.html"><span class="nav-icon">🔔</span> التنبيهات
        <span class="nav-badge" id="alert-nav-badge">${stats.alerts}</span>
      </a>
      <div class="nav-section-title">الإعدادات</div>
      <a class="nav-item" href="geofence.html"><span class="nav-icon">🏁</span> مناطق الجيوفنس</a>
      <a class="nav-item" href="account.html"><span class="nav-icon">👤</span> حسابي</a>
    </nav>
    <div class="sidebar-footer"><div class="user-card"><div class="user-avatar">م</div><div class="user-info"><h4>مدير الأسطول</h4><span>متصل الآن</span></div></div></div>`;
}

function initMap() {
  histMap = L.map('history-map', { center: [30.044, 31.235], zoom: 11, zoomControl: false, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(histMap);
  L.control.zoom({ position: 'bottomleft' }).addTo(histMap);
}

function populateVehicleSelect() {
  const sel = document.getElementById('vehicle-select');
  FleetData.getVehicles().forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = `${v.name} — ${v.plate}`;
    sel.appendChild(opt);
  });

  // Check if URL has ?id=
  const params = new URLSearchParams(window.location.search);
  const preId = params.get('id');
  if (preId) sel.value = preId;

  // Set today's date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('date-select').value = today;

  if (preId) loadTrips();
}

function onVehicleChange() { loadTrips(); }
function onDateChange() { loadTrips(); }

function loadTrips() {
  const vehicleId = document.getElementById('vehicle-select').value;
  const date = document.getElementById('date-select').value;
  if (!vehicleId || !date) return;

  currentTrips = FleetData.getVehicleHistory(vehicleId, date);
  renderTripList(currentTrips, vehicleId, date);
  if (currentTrips.length > 0) {
    showAllTrips();
  } else {
    clearMap();
  }
}

function renderTripList(trips, vehicleId, date) {
  const v = FleetData.getVehicleById(vehicleId);
  const container = document.getElementById('trips-list');
  const summary = document.getElementById('trip-summary');
  const dayStats = document.getElementById('day-stats');
  const dayGrid = document.getElementById('day-stats-grid');

  const totalKm = trips.reduce((s, t) => s + t.distanceKm, 0).toFixed(1);
  const totalFuel = trips.reduce((s, t) => s + t.fuelUsedL, 0).toFixed(1);
  const totalStops = trips.reduce((s, t) => s + t.stops.length, 0);
  const totalDuration = trips.reduce((s, t) => s + t.durationMin, 0);

  summary.textContent = v ? `${v.name} — ${new Date(date).toLocaleDateString('ar-EG', {day:'numeric',month:'long',year:'numeric'})}` : '';

  if (trips.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📍</div><h3>لا توجد رحلات</h3><p>لم تُسجَّل رحلات في هذا اليوم</p></div>`;
    dayStats.style.display = 'none';
    return;
  }

  container.innerHTML = trips.map((t, i) => {
    const st = new Date(t.startTime).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    const et = new Date(t.endTime).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    const dh = Math.floor(t.durationMin / 60);
    const dm = t.durationMin % 60;
    const durStr = dh > 0 ? `${dh}س ${dm}د` : `${dm}د`;
    return `
      <div class="trip-card" id="trip-${i}" onclick="showTrip(${i})">
        <div class="trip-header">
          <span class="trip-time">🕐 ${st} ← ${et}</span>
          <span style="font-size:11px;color:var(--accent-light);font-weight:700">${t.distanceKm} كم</span>
        </div>
        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px">
          📍 ${t.startLocation.substring(0,28)}... → ${t.endLocation.substring(0,22)}...
        </div>
        <div class="trip-stats">
          <span class="trip-stat">⏱️ ${durStr}</span>
          <span class="trip-stat">⚡ متوسط ${t.avgSpeedKmh} كم/س</span>
          <span class="trip-stat">🚀 أعلى ${t.maxSpeedKmh} كم/س</span>
          <span class="trip-stat">⛽ ${t.fuelUsedL} ل</span>
          ${t.stops.length > 0 ? `<span class="stop-badge">🛑 ${t.stops.length} توقف</span>` : ''}
        </div>
      </div>`;
  }).join('');

  dayStats.style.display = 'block';
  dayGrid.innerHTML = `
    <div class="vd-stat"><div class="vd-stat-val text-accent">${totalKm}</div><div class="vd-stat-lbl">إجمالي كم</div></div>
    <div class="vd-stat"><div class="vd-stat-val" style="color:var(--purple)">${totalFuel}</div><div class="vd-stat-lbl">لتر وقود</div></div>
    <div class="vd-stat"><div class="vd-stat-val">${trips.length}</div><div class="vd-stat-lbl">رحلات</div></div>
    <div class="vd-stat"><div class="vd-stat-val text-yellow">${totalStops}</div><div class="vd-stat-lbl">توقفات</div></div>`;
}

function clearMap() {
  layers.forEach(l => histMap.removeLayer(l));
  layers = [];
}

function showTrip(idx) {
  document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`trip-${idx}`)?.classList.add('active');
  const trip = currentTrips[idx];
  if (!trip) return;

  clearMap();
  const points = [[trip.startLat, trip.startLng]];
  trip.stops.forEach(s => points.push([s.lat, s.lng]));
  points.push([trip.endLat, trip.endLng]);

  // Route line
  const line = L.polyline(points, { color: '#3b82f6', weight: 4, opacity: 0.85 }).addTo(histMap);
  layers.push(line);

  // Start marker
  const startM = L.marker([trip.startLat, trip.startLng], {
    icon: L.divIcon({ html: '<div style="background:#22c55e;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>', className: '', iconSize: [16, 16], iconAnchor: [8, 8] })
  }).addTo(histMap).bindPopup(`<b>بداية الرحلة</b><br>${trip.startLocation}<br>${new Date(trip.startTime).toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'})}`);
  layers.push(startM);

  // Stop markers
  trip.stops.forEach((s, si) => {
    const sm = L.marker([s.lat, s.lng], {
      icon: L.divIcon({ html: `<div style="background:#f59e0b;width:12px;height:12px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`, className: '', iconSize: [12, 12], iconAnchor: [6, 6] })
    }).addTo(histMap).bindPopup(`<b>توقف ${si + 1}</b><br>${s.location}<br>المدة: ${s.duration} دقيقة`);
    layers.push(sm);
  });

  // End marker
  const endM = L.marker([trip.endLat, trip.endLng], {
    icon: L.divIcon({ html: '<div style="background:#ef4444;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>', className: '', iconSize: [16, 16], iconAnchor: [8, 8] })
  }).addTo(histMap).bindPopup(`<b>نهاية الرحلة</b><br>${trip.endLocation}<br>${new Date(trip.endTime).toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'})}`);
  layers.push(endM);

  histMap.fitBounds(line.getBounds().pad(0.15));

  // Info box
  const info = document.getElementById('map-info');
  const infoBody = document.getElementById('map-info-body');
  info.style.display = 'block';
  document.getElementById('map-info-title').textContent = `رحلة ${idx + 1} من ${currentTrips.length}`;
  const dh = Math.floor(trip.durationMin / 60), dm = trip.durationMin % 60;
  infoBody.innerHTML = `
    <div style="font-size:11px;color:#8892a4;display:grid;grid-template-columns:1fr 1fr;gap:4px">
      <span>المسافة:</span><span style="color:var(--text-primary);font-weight:600">${trip.distanceKm} كم</span>
      <span>المدة:</span><span style="color:var(--text-primary);font-weight:600">${dh > 0 ? dh+'س ' : ''}${dm}د</span>
      <span>متوسط السرعة:</span><span style="color:var(--text-primary);font-weight:600">${trip.avgSpeedKmh} كم/س</span>
      <span>أعلى سرعة:</span><span style="color:${trip.maxSpeedKmh > 100 ? '#ef4444' : 'var(--text-primary)'};font-weight:600">${trip.maxSpeedKmh} كم/س</span>
      <span>الوقود:</span><span style="color:var(--text-primary);font-weight:600">${trip.fuelUsedL} لتر</span>
      <span>التوقفات:</span><span style="color:#f59e0b;font-weight:600">${trip.stops.length}</span>
    </div>`;
}

function showAllTrips() {
  if (currentTrips.length === 0) return;
  document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('active'));
  clearMap();

  const allPoints = [];
  const colors = ['#3b82f6', '#22c55e', '#a855f7', '#f59e0b', '#ef4444', '#06b6d4'];

  currentTrips.forEach((trip, i) => {
    const pts = [[trip.startLat, trip.startLng], ...trip.stops.map(s => [s.lat, s.lng]), [trip.endLat, trip.endLng]];
    allPoints.push(...pts);
    const line = L.polyline(pts, { color: colors[i % colors.length], weight: 3, opacity: 0.7 }).addTo(histMap);
    layers.push(line);

    L.marker([trip.startLat, trip.startLng], {
      icon: L.divIcon({ html: `<div style="background:${colors[i % colors.length]};color:white;width:20px;height:20px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${i + 1}</div>`, className: '', iconSize: [20, 20], iconAnchor: [10, 10] })
    }).addTo(histMap).bindPopup(`<b>رحلة ${i + 1}</b><br>${trip.startLocation}`);
    layers.push(layers[layers.length - 1]);
  });

  if (allPoints.length > 0) {
    const bounds = L.latLngBounds(allPoints);
    histMap.fitBounds(bounds.pad(0.1));
  }
  document.getElementById('map-info').style.display = 'none';
}

renderSharedSidebar();
initMap();
populateVehicleSelect();
</script>
</body>
</html>
