name: Build Full TOP-GPS Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare FULL TOP-GPS Web System for Android App
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const target = 'android/app/src/main/assets/public';

            function copyFolderSync(from, to) {
              if (!fs.existsSync(to)) fs.mkdirSync(to, { recursive: true });
              fs.readdirSync(from).forEach(element => {
                const stat = fs.lstatSync(path.join(from, element));
                if (stat.isFile()) {
                  if (!element.endsWith('.apk') && !element.endsWith('.log')) {
                    fs.copyFileSync(path.join(from, element), path.join(to, element));
                  }
                } else if (stat.isDirectory()) {
                  if (element !== 'node_modules' && element !== 'android' && element !== '.git' && element !== '.github' && element !== 'www') {
                    copyFolderSync(path.join(from, element), path.join(to, element));
                  }
                }
              });
            }

            copyFolderSync('.', target);
            console.log('✅ Full TOP-GPS Dashboard System copied to Android app assets!');
          "

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TOP-GPS-Full-System.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOP-GPS-Full-System-APK
          path: TOP-GPS-Full-System.apk

      - name: Create Direct GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0
          name: "📱 TOP-GPS Full System App v2.0.0"
          body: "نظام TOP-GPS المتكامل لإدارة وتتبع أسطول السيارات بالكامل — خريطة حية، سيارات، سائقين، تقارير، وتنبيهات بملف APK مباشر!"
          files: TOP-GPS-Full-System.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
