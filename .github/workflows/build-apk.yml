name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Assets for Android App
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const target = 'android/app/src/main/assets/public';
            if (!fs.existsSync(target)) fs.mkdirSync(target, { recursive: true });
            fs.copyFileSync('tracker.html', path.join(target, 'index.html'));
            fs.copyFileSync('manifest.json', path.join(target, 'manifest.json'));
            console.log('✅ Web assets ready in android/app/src/main/assets/public');
          "

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TOP-GPS-Tracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOP-GPS-Tracker-APK
          path: TOP-GPS-Tracker.apk

      - name: Create Direct GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "📱 TOP-GPS Tracker App v1.0.0"
          body: "تطبيق تتبع السائقين المباشر لأجهزة الأندرويد — قم بتنزيل ملف TOP-GPS-Tracker.apk وتثبيته مباشرة على التليفون!"
          files: TOP-GPS-Tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
